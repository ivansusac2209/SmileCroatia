    <path d="M70 140 Q250 60 430 140" stroke-width="3" opacity=".3"/>
    <path d="M70 200 Q250 290 430 200" stroke-width="3" opacity=".3"/>
  </g>
  <g fill="#e8f0f6" opacity=".88">
