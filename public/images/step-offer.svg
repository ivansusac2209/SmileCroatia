<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4efe7"/><stop offset="1" stop-color="#e2d8c9"/></linearGradient>
  <radialGradient id="xr" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#2a3d52"/><stop offset="1" stop-color="#0b1622"/></radialGradient>
</defs>
<rect width="800" height="520" fill="url(#bg)"/>
<!-- desk -->
<rect y="400" width="800" height="120" fill="#b88e66"/><rect y="400" width="800" height="10" fill="#a47b55"/>
<!-- laptop -->
