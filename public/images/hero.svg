<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cfe8"/><stop offset=".55" stop-color="#e3eef3"/><stop offset="1" stop-color="#f6efe4"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fb5"/><stop offset="1" stop-color="#1f5f86"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa58a"/><stop offset="1" stop-color="#5f7a5c"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1c9a8"/><stop offset="1" stop-color="#d9a37f"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4429"/><stop offset="1" stop-color="#3e2616"/></linearGradient>
  <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e9ee"/></linearGradient>
  <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e1" stop-opacity=".9"/><stop offset="1" stop-color="#fff8e1" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="1200" fill="url(#sky)"/>
<circle cx="1180" cy="230" r="260" fill="url(#sun)"/>
<g fill="#fff" opacity=".7"><ellipse cx="420" cy="180" rx="140" ry="26"/><ellipse cx="520" cy="160" rx="90" ry="22"/><ellipse cx="1350" cy="120" rx="120" ry="20"/></g>
<!-- distant islands -->
<path d="M0 560 Q200 500 420 545 T820 535 T1250 520 T1600 540 V600 H0Z" fill="#9fb6c2"/>
<rect y="580" width="1600" height="620" fill="url(#sea)"/>
<g stroke="#bfe0ef" stroke-width="3" opacity=".5" fill="none"><path d="M80 660h120M300 700h160M140 760h90M520 650h110"/><path d="M60 840h140M380 800h120"/></g>
<!-- old town walls on headland -->
<path d="M0 640 Q160 600 360 615 L560 640 L620 720 L0 760Z" fill="url(#hill)"/>
<g>
  <rect x="40" y="560" width="520" height="110" fill="#e9d7b9"/>
  <path d="M40 560h520" stroke="#cdb48d" stroke-width="6"/>
  <g fill="#c8633f">
    <path d="M70 560 l40-38 40 38z"/><path d="M160 560 l50-44 50 44z"/><path d="M290 560 l36-32 36 32z"/><path d="M390 560 l50-46 50 46z"/><path d="M480 560 l35-30 35 30z"/>
  </g>
  <g fill="#f3e6cf"><rect x="70" y="560" width="80" height="60"/><rect x="160" y="560" width="100" height="70"/><rect x="290" y="560" width="72" height="56"/><rect x="390" y="560" width="100" height="74"/><rect x="480" y="560" width="70" height="56"/></g>
  <g fill="#d7a97a"><rect x="90" y="578" width="10" height="16"/><rect x="118" y="578" width="10" height="16"/><rect x="185" y="580" width="10" height="16"/><rect x="215" y="580" width="10" height="16"/><rect x="415" y="582" width="10" height="16"/><rect x="450" y="582" width="10" height="16"/><rect x="310" y="576" width="10" height="16"/></g>
  <rect x="250" y="470" width="44" height="160" fill="#efdfc3"/><path d="M244 470h56l-28-40z" fill="#b8573a"/>
  <path d="M30 670 Q20 610 60 600 L560 600 Q600 610 590 680 Z" fill="none"/>
  <path d="M20 680 L40 620 L560 620 L600 690Z" fill="#dcc29b"/>
</g>
<!-- terrace -->
<rect y="900" width="1600" height="300" fill="#efe6d8"/>
<rect y="880" width="1600" height="26" fill="#e2d4bf"/>
<g fill="#f7f1e7"><rect x="0" y="830" width="1600" height="18"/></g>
<g fill="#e7dccb"><rect x="60" y="848" width="16" height="40"/><rect x="180" y="848" width="16" height="40"/><rect x="300" y="848" width="16" height="40"/><rect x="420" y="848" width="16" height="40"/><rect x="540" y="848" width="16" height="40"/><rect x="660" y="848" width="16" height="40"/><rect x="1440" y="848" width="16" height="40"/><rect x="1560" y="848" width="16" height="40"/></g>
<!-- bougainvillea -->
<g transform="translate(1380 0)">
  <path d="M220 0 Q120 120 160 260 Q60 360 120 520" stroke="#5c4a36" stroke-width="10" fill="none"/>
  <g fill="#d94a8c"><circle cx="160" cy="60" r="70"/><circle cx="100" cy="150" r="60"/><circle cx="190" cy="200" r="70"/><circle cx="120" cy="300" r="56"/><circle cx="200" cy="360" r="50"/></g>
  <g fill="#ef7fb1" opacity=".8"><circle cx="140" cy="40" r="30"/><circle cx="80" cy="140" r="26"/><circle cx="170" cy="220" r="32"/><circle cx="110" cy="290" r="24"/></g>
  <g fill="#4f7a43"><ellipse cx="60" cy="100" rx="26" ry="12"/><ellipse cx="220" cy="280" rx="26" ry="12"/><ellipse cx="80" cy="360" rx="22" ry="10"/></g>
</g>
<!-- woman -->
<g transform="translate(870 300)">
  <!-- hair back -->
  <path d="M150 40 Q60 60 70 230 Q60 420 120 520 L370 520 Q420 380 380 220 Q380 40 260 30 Z" fill="url(#hair)"/>
  <!-- neck -->
  <path d="M190 300 L270 300 L282 420 L180 420Z" fill="#d9a37f"/>
  <!-- body / dress -->
  <path d="M40 900 Q40 520 150 450 Q200 420 230 440 Q260 420 310 450 Q430 520 430 900Z" fill="url(#dress)"/>
  <path d="M170 440 Q230 520 290 440" fill="#e8b892"/>
  <path d="M150 450 Q230 540 310 450" stroke="#d6dbe2" stroke-width="6" fill="none"/>
  <!-- face -->
  <ellipse cx="230" cy="200" rx="108" ry="128" fill="url(#skin)"/>
  <ellipse cx="124" cy="210" rx="16" ry="26" fill="#d9a37f"/>
  <ellipse cx="336" cy="210" rx="16" ry="26" fill="#d9a37f"/>
  <circle cx="122" cy="238" r="7" fill="#e7b13c"/>
  <!-- hair front -->
  <path d="M120 170 Q130 60 240 62 Q350 66 346 190 Q320 110 250 100 Q180 120 120 170Z" fill="url(#hair)"/>
  <!-- brows / eyes closed happy -->
  <g stroke="#4a2e1c" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M168 160 q24-12 46 0"/><path d="M248 160 q24-12 46 0"/>
    <path d="M172 194 q20 16 40 0"/><path d="M252 194 q20 16 40 0"/>
  </g>
  <ellipse cx="172" cy="240" rx="20" ry="11" fill="#e98a7d" opacity=".35"/>
  <ellipse cx="292" cy="240" rx="20" ry="11" fill="#e98a7d" opacity=".35"/>
  <path d="M230 206 q-8 30 4 36" stroke="#c78a63" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M180 262 Q232 330 284 262 Q232 280 180 262Z" fill="#fff" stroke="#b5574d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M190 268 Q232 280 274 268" stroke="#eceff2" stroke-width="2" fill="none"/>
  <!-- sunglasses on head -->
  <g transform="translate(160 78)"><rect width="56" height="30" rx="14" fill="#1b2a3a"/><rect x="84" width="56" height="30" rx="14" fill="#1b2a3a"/><path d="M56 12h28" stroke="#1b2a3a" stroke-width="6"/></g>
</g>
</svg>
