<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e9dc"/><stop offset="1" stop-color="#ecd2bd"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eebf9c"/><stop offset="1" stop-color="#d49a74"/></linearGradient>
  <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eeeae0"/></linearGradient>
</defs>
<rect width="800" height="400" fill="url(#bg)"/>
<!-- close-up smile -->
<path d="M0 0 H800 V400 H0Z" fill="url(#skin)" opacity=".55"/>
<!-- lips outer -->
<path d="M110 200 Q250 70 400 110 Q550 70 690 200 Q560 360 400 360 Q240 360 110 200Z" fill="#c7656b"/>
<path d="M110 200 Q250 70 400 110 Q550 70 690 200 Q400 150 110 200Z" fill="#b5535a"/>
<!-- mouth opening -->
<path d="M150 200 Q400 150 650 200 Q560 320 400 322 Q240 320 150 200Z" fill="#5a1f26"/>
<!-- upper teeth -->
<g fill="url(#tooth)" stroke="#e2ddd2" stroke-width="2">
  <path d="M352 178 h48 v62 q-24 10 -48 0z"/>
  <path d="M400 178 h48 v62 q-24 10 -48 0z"/>
  <path d="M310 182 h42 v54 q-21 9 -42 0z"/>
  <path d="M448 182 h42 v54 q-21 9 -42 0z"/>
  <path d="M272 188 h38 v44 q-19 8 -38 0z"/>
  <path d="M490 188 h38 v44 q-19 8 -38 0z"/>
  <path d="M238 194 h34 v34 q-17 6 -34 0z"/>
  <path d="M528 194 h34 v34 q-17 6 -34 0z"/>
  <path d="M206 200 h32 v24 q-16 5 -32 0z"/>
  <path d="M562 200 h32 v24 q-16 5 -32 0z"/>
</g>
<!-- lower teeth hint -->
<g fill="#efebe2" opacity=".85"><path d="M300 290 q100 22 200 0 v-14 q-100 18 -200 0z"/></g>
<!-- upper lip line over teeth -->
<path d="M150 200 Q400 150 650 200 Q400 168 150 200Z" fill="#b5535a"/>
<!-- highlights -->
<g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".85"><path d="M366 190 v24"/><path d="M414 190 v24"/><path d="M322 192 v18"/></g>
<path d="M260 116 Q330 96 380 120" stroke="#e48e93" stroke-width="8" stroke-linecap="round" fill="none" opacity=".6"/>
<path d="M300 336 Q400 350 500 336" stroke="#d97e84" stroke-width="10" stroke-linecap="round" fill="none" opacity=".5"/>
<!-- sparkles -->
<g fill="#ffffff"><path d="M640 100 l7 21 21 7 -21 7 -7 21 -7-21 -21-7 21-7z"/><path d="M700 160 l4 12 12 4 -12 4 -4 12 -4-12 -12-4 12-4z"/><path d="M130 110 l5 15 15 5 -15 5 -5 15 -5-15 -15-5 15-5z"/></g>
</svg>
