<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1f6"/><stop offset="1" stop-color="#cddbe6"/></linearGradient>
  <linearGradient id="tooth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f4f2ec"/><stop offset="1" stop-color="#ddd8cc"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5d98a"/><stop offset="1" stop-color="#c79a3a"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="400" fill="url(#bg)"/>
<ellipse cx="400" cy="210" rx="320" ry="160" fill="url(#glow)"/>
<!-- surface -->
<ellipse cx="400" cy="330" rx="330" ry="40" fill="#b9c9d6" opacity=".6"/>
<!-- three crowns -->
<g id="crown">
  <path d="M-62 -40 Q-70 -110 -30 -118 Q0 -100 0 -100 Q0 -100 30 -118 Q70 -110 62 -40 Q58 20 40 40 L-40 40 Q-58 20 -62 -40Z" fill="url(#tooth)" stroke="#d8d2c4" stroke-width="3"/>
  <path d="M-40 -90 Q-30 -60 -44 -20" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".9"/>
  <path d="M-40 40 L-30 60 L30 60 L40 40Z" fill="#e8e3d6"/>
</g>
<use href="#crown" transform="translate(250 270) scale(.85)"/>
<use href="#crown" transform="translate(550 270) scale(.85)"/>
<g transform="translate(400 250) scale(1.1)">
  <path d="M-62 -40 Q-70 -110 -30 -118 Q0 -100 0 -100 Q0 -100 30 -118 Q70 -110 62 -40 Q58 20 40 40 L-40 40 Q-58 20 -62 -40Z" fill="url(#tooth)" stroke="#d8d2c4" stroke-width="3"/>
  <path d="M-40 -90 Q-30 -60 -44 -20" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M-40 40 L-30 60 L30 60 L40 40Z" fill="#e8e3d6"/>
</g>
<!-- shade guide -->
<g transform="translate(90 120) rotate(-10)">
  <rect width="22" height="110" rx="10" fill="#f6f1e4"/><rect x="28" width="22" height="110" rx="10" fill="#efe6d1"/><rect x="56" width="22" height="110" rx="10" fill="#e8dcc0"/><rect x="84" width="22" height="110" rx="10" fill="#dfd0ad"/>
  <rect x="-6" y="80" width="118" height="40" rx="6" fill="#1d3550"/>
</g>
<!-- sparkle -->
<g fill="#ffffff"><path d="M650 90 l6 18 18 6 -18 6 -6 18 -6-18 -18-6 18-6z"/><path d="M470 80 l4 12 12 4 -12 4 -4 12 -4-12 -12-4 12-4z"/></g>
<g fill="url(#gold)"><circle cx="690" cy="300" r="6"/></g>
</svg>
